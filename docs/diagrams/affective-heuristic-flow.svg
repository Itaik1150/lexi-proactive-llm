<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 970" width="780" height="970"
     font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif">

  <defs>
    <marker id="arr"        viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><polygon points="0,0 10,5 0,10" fill="#546e7a"/></marker>
    <marker id="arr-green"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2e7d32"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><polygon points="0,0 10,5 0,10" fill="#e65100"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><polygon points="0,0 10,5 0,10" fill="#6a1b9a"/></marker>
    <marker id="arr-red"    viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><polygon points="0,0 10,5 0,10" fill="#b71c1c"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/></filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="970" fill="#f4f6f9"/>

  <!-- Header -->
  <rect x="0" y="0" width="780" height="62" fill="#1a2744"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Affective Heuristic - Workflow</text>
  <text x="390" y="50" text-anchor="middle" font-size="12" fill="#90caf9">Emotional Check-in Generation - LEXI Proactive System</text>

  <!-- Phase 1 band -->
  <rect x="22" y="74" width="736" height="434" rx="12" fill="#fff8f0"
        stroke="#fb8c00" stroke-width="1.8" stroke-dasharray="9,5" filter="url(#sh)"/>
  <rect x="262" y="66" width="256" height="22" rx="7" fill="#ef6c00"/>
  <text x="390" y="81" text-anchor="middle" font-size="11.5" font-weight="bold" fill="white">Phase 1 - Memory Creation (create_memory)</text>

  <!-- STEP 1: Scheduler -->
  <g filter="url(#sh)">
    <rect x="255" y="92" width="270" height="58" rx="10" fill="white" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="255" y="92" width="270" height="30" rx="10" fill="#1565c0"/>
    <rect x="255" y="110" width="270" height="12" fill="#1565c0"/>
    <text x="390" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Scheduler Triggers</text>
    <text x="390" y="138" text-anchor="middle" font-size="11" fill="#546e7a">Runs periodically for each active user</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="390" y1="150" x2="390" y2="174" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 2: Read conversations -->
  <g filter="url(#sh)">
    <rect x="235" y="176" width="310" height="58" rx="10" fill="white" stroke="#e65100" stroke-width="2"/>
    <rect x="235" y="176" width="310" height="30" rx="10" fill="#e65100"/>
    <rect x="235" y="194" width="310" height="12" fill="#e65100"/>
    <text x="390" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Read Last 3 Conversations</text>
    <text x="390" y="222" text-anchor="middle" font-size="11" fill="#546e7a">Fetch user messages from MongoDB</text>
  </g>

  <!-- Arrow 2 to decision -->
  <line x1="390" y1="234" x2="390" y2="260" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DECISION 1: New messages? diamond centered at 390, 285 -->
  <g filter="url(#sh)">
    <polygon points="390,260 508,285 390,310 272,285" fill="white" stroke="#795548" stroke-width="2"/>
    <text x="390" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#4e342e">New messages</text>
    <text x="390" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#4e342e">since last run?</text>
  </g>

  <!-- No arrow: right exit -->
  <line x1="508" y1="285" x2="586" y2="285" stroke="#9e9e9e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="540" y="278" text-anchor="middle" font-size="10" fill="#9e9e9e">No</text>
  <rect x="588" y="272" width="76" height="26" rx="6" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="626" y="289" text-anchor="middle" font-size="11" fill="#546e7a">Skip / End</text>

  <!-- Yes arrow: down -->
  <line x1="390" y1="310" x2="390" y2="338" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="401" y="330" font-size="10" fill="#546e7a">Yes</text>

  <!-- STEP 3: LLM extraction -->
  <g filter="url(#sh)">
    <rect x="215" y="340" width="350" height="62" rx="10" fill="white" stroke="#6a1b9a" stroke-width="2.5"/>
    <rect x="215" y="340" width="350" height="32" rx="10" fill="#6a1b9a"/>
    <rect x="215" y="360" width="350" height="12" fill="#6a1b9a"/>
    <text x="390" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="white">LLM: Analyze for Emotional Content</text>
    <text x="390" y="390" text-anchor="middle" font-size="11" fill="#546e7a">Extracts emotional shares - assigns affective score 1-10</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="390" y1="402" x2="390" y2="428" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 4: Save memories -->
  <g filter="url(#sh)">
    <rect x="248" y="430" width="284" height="58" rx="10" fill="white" stroke="#e65100" stroke-width="2"/>
    <rect x="248" y="430" width="284" height="30" rx="10" fill="#e65100"/>
    <rect x="248" y="448" width="284" height="12" fill="#e65100"/>
    <text x="390" y="451" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Save Emotional Memories</text>
    <text x="390" y="476" text-anchor="middle" font-size="11" fill="#546e7a">Stored in MongoDB with score &amp; timestamp</text>
  </g>

  <!-- Phase 2 band -->
  <rect x="22" y="530" width="736" height="360" rx="12" fill="#f0f4ff"
        stroke="#5c6bc0" stroke-width="1.8" stroke-dasharray="9,5" filter="url(#sh)"/>
  <rect x="242" y="522" width="296" height="22" rx="7" fill="#3949ab"/>
  <text x="390" y="537" text-anchor="middle" font-size="11.5" font-weight="bold" fill="white">Phase 2 - Message Generation (get_proactive_message)</text>

  <!-- Arrow phase gap 4 to 5 -->
  <line x1="390" y1="488" x2="390" y2="550" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 5: Expire old memories -->
  <g filter="url(#sh)">
    <rect x="248" y="552" width="284" height="58" rx="10" fill="white" stroke="#607d8b" stroke-width="2"/>
    <rect x="248" y="552" width="284" height="30" rx="10" fill="#607d8b"/>
    <rect x="248" y="570" width="284" height="12" fill="#607d8b"/>
    <text x="390" y="573" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Expire Old Memories (&gt;72 h)</text>
    <text x="390" y="598" text-anchor="middle" font-size="11" fill="#546e7a">Stale unused memories are marked done</text>
  </g>

  <!-- Arrow 5 to decision 2 -->
  <line x1="390" y1="610" x2="390" y2="636" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DECISION 2: Unused memories? diamond centered at 390, 662 -->
  <g filter="url(#sh)">
    <polygon points="390,636 514,662 390,688 266,662" fill="white" stroke="#795548" stroke-width="2"/>
    <text x="390" y="657" text-anchor="middle" font-size="11" font-weight="bold" fill="#4e342e">Unused emotional</text>
    <text x="390" y="673" text-anchor="middle" font-size="11" font-weight="bold" fill="#4e342e">memories?</text>
  </g>

  <!-- Yes arrow: right branch -->
  <path d="M 514,662 L 622,662 L 622,716" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="567" y="655" text-anchor="middle" font-size="10" fill="#2e7d32">Yes</text>

  <!-- No arrow: left branch -->
  <path d="M 266,662 L 160,662 L 160,716" stroke="#ef6c00" stroke-width="2" fill="none" marker-end="url(#arr-orange)"/>
  <text x="213" y="655" text-anchor="middle" font-size="10" fill="#ef6c00">No</text>

  <!-- RIGHT: Pick best memory -->
  <g filter="url(#sh)">
    <rect x="498" y="718" width="248" height="58" rx="10" fill="white" stroke="#2e7d32" stroke-width="2"/>
    <rect x="498" y="718" width="248" height="30" rx="10" fill="#2e7d32"/>
    <rect x="498" y="736" width="248" height="12" fill="#2e7d32"/>
    <text x="622" y="739" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Pick Highest-Scored Memory</text>
    <text x="622" y="764" text-anchor="middle" font-size="10.5" fill="#546e7a">Highest affective score - mark as used</text>
  </g>

  <!-- Arrow right pick to LLM -->
  <line x1="622" y1="776" x2="622" y2="800" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- RIGHT: LLM personalized check-in -->
  <g filter="url(#sh)">
    <rect x="492" y="802" width="260" height="58" rx="10" fill="white" stroke="#6a1b9a" stroke-width="2.5"/>
    <rect x="492" y="802" width="260" height="30" rx="10" fill="#6a1b9a"/>
    <rect x="492" y="820" width="260" height="12" fill="#6a1b9a"/>
    <text x="622" y="823" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LLM: Personalised Check-in</text>
    <text x="622" y="848" text-anchor="middle" font-size="10.5" fill="#546e7a">References the specific emotional memory</text>
  </g>

  <!-- LEFT: Cold start box -->
  <g filter="url(#sh)">
    <rect x="36" y="718" width="248" height="58" rx="10" fill="white" stroke="#ef6c00" stroke-width="2"/>
    <rect x="36" y="718" width="248" height="30" rx="10" fill="#ef6c00"/>
    <rect x="36" y="736" width="248" height="12" fill="#ef6c00"/>
    <text x="160" y="739" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cold Start (No Memories)</text>
    <text x="160" y="764" text-anchor="middle" font-size="10.5" fill="#546e7a">No prior emotional context available</text>
  </g>

  <!-- Arrow left cold to LLM -->
  <line x1="160" y1="776" x2="160" y2="800" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#arr-orange)"/>

  <!-- LEFT: LLM warm invitation -->
  <g filter="url(#sh)">
    <rect x="32" y="802" width="256" height="58" rx="10" fill="white" stroke="#6a1b9a" stroke-width="2.5"/>
    <rect x="32" y="802" width="256" height="30" rx="10" fill="#6a1b9a"/>
    <rect x="32" y="820" width="256" height="12" fill="#6a1b9a"/>
    <text x="160" y="823" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LLM: Warm Invitation</text>
    <text x="160" y="848" text-anchor="middle" font-size="10.5" fill="#546e7a">Generic empathetic check-in message</text>
  </g>

  <!-- Converge both paths to Send notification -->
  <path d="M 160,860 Q 160,900 350,910" stroke="#b71c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <path d="M 622,860 Q 622,900 442,910" stroke="#b71c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>

  <!-- STEP 7: Send push notification -->
  <g filter="url(#sh)">
    <rect x="252" y="895" width="276" height="58" rx="10" fill="white" stroke="#b71c1c" stroke-width="2.5"/>
    <rect x="252" y="895" width="276" height="30" rx="10" fill="#b71c1c"/>
    <rect x="252" y="913" width="276" height="12" fill="#b71c1c"/>
    <text x="390" y="916" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Send Push Notification</text>
    <text x="390" y="941" text-anchor="middle" font-size="11" fill="#546e7a">Delivered to user via Firebase FCM</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="956" width="780" height="14" fill="#1a2744"/>
  <text x="390" y="966" text-anchor="middle" font-size="9" fill="#90caf9">LEXI - Master Thesis 2026-2027 - Affective Heuristic Workflow</text>

</svg>
