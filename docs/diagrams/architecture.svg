<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820"
     font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif">

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#546e7a"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#1565c0"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#b71c1c"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#e65100"/>
    </marker>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#00695c"/>
    </marker>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#6a1b9a"/>
    </marker>

    <filter id="sh">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="68" fill="#0d1b2a"/>
  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="white">LEXI -- Proactive Experiment Platform</text>
  <text x="600" y="54" text-anchor="middle" font-size="13" fill="#90caf9">System Architecture -- Master Thesis 2026-2027</text>


  <!-- ============================================================ -->
  <!-- ROW 1: Actors -->
  <!-- ============================================================ -->

  <!-- Researcher -->
  <g>
    <circle cx="200" cy="128" r="26" fill="#455a64" stroke="#263238" stroke-width="2" filter="url(#sh)"/>
    <circle cx="200" cy="121" r="10" fill="#eceff1"/>
    <path d="M 181,143 Q 200,132 219,143" fill="#eceff1"/>
    <text x="200" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Researcher</text>
  </g>

  <!-- Participant -->
  <g>
    <circle cx="1000" cy="128" r="26" fill="#455a64" stroke="#263238" stroke-width="2" filter="url(#sh)"/>
    <circle cx="1000" cy="121" r="10" fill="#eceff1"/>
    <path d="M 981,143 Q 1000,132 1019,143" fill="#eceff1"/>
    <text x="1000" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Participant</text>
  </g>


  <!-- ============================================================ -->
  <!-- ROW 2: Client Layer -->
  <!-- ============================================================ -->

  <!-- React Client -->
  <g filter="url(#sh)">
    <rect x="60" y="210" width="260" height="100" rx="14" fill="white" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="60" y="210" width="260" height="46" rx="14" fill="#1565c0"/>
    <rect x="60" y="240" width="260" height="16" fill="#1565c0"/>
    <text x="190" y="239" text-anchor="middle" font-size="15" font-weight="bold" fill="white">React Client</text>
    <text x="190" y="278" text-anchor="middle" font-size="12" fill="#546e7a">Web App (Vercel)</text>
  </g>

  <!-- Android APK -->
  <g filter="url(#sh)">
    <rect x="880" y="210" width="260" height="100" rx="14" fill="white" stroke="#2e7d32" stroke-width="2.5"/>
    <rect x="880" y="210" width="260" height="46" rx="14" fill="#2e7d32"/>
    <rect x="880" y="240" width="260" height="16" fill="#2e7d32"/>
    <text x="1010" y="239" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Android App</text>
    <text x="1010" y="278" text-anchor="middle" font-size="12" fill="#546e7a">WebView + FCM Client</text>
  </g>


  <!-- ============================================================ -->
  <!-- ROW 3: Server Layer (Render instance) -->
  <!-- ============================================================ -->

  <!-- Render dashed boundary -->
  <rect x="90" y="375" width="760" height="140" rx="16" fill="#fffde7"
        stroke="#f57c00" stroke-width="2.5" stroke-dasharray="12,6" filter="url(#sh)"/>
  <rect x="290" y="363" width="220" height="24" rx="7" fill="#ff8f00"/>
  <text x="400" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="white">Render -- Single Instance</text>

  <!-- Node.js API Server -->
  <g filter="url(#sh)">
    <rect x="108" y="392" width="270" height="106" rx="12" fill="white" stroke="#4527a0" stroke-width="2.5"/>
    <rect x="108" y="392" width="270" height="46" rx="12" fill="#4527a0"/>
    <rect x="108" y="422" width="270" height="16" fill="#4527a0"/>
    <text x="243" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Node.js API Server</text>
    <text x="243" y="466" text-anchor="middle" font-size="12" fill="#546e7a">REST API + Auth + Chat</text>
  </g>

  <!-- Python Proactive Engine -->
  <g filter="url(#sh)">
    <rect x="422" y="392" width="296" height="106" rx="12" fill="white" stroke="#bf360c" stroke-width="2.5"/>
    <rect x="422" y="392" width="296" height="46" rx="12" fill="#bf360c"/>
    <rect x="422" y="422" width="296" height="16" fill="#bf360c"/>
    <text x="570" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Python Proactive Engine</text>
    <text x="570" y="466" text-anchor="middle" font-size="12" fill="#546e7a">Scheduler + Heuristics + LLM</text>
  </g>


  <!-- ============================================================ -->
  <!-- ROW 4: Data / External Layer -->
  <!-- ============================================================ -->

  <!-- MongoDB Atlas -->
  <g filter="url(#sh)">
    <rect x="60" y="590" width="270" height="100" rx="14" fill="white" stroke="#e65100" stroke-width="2.5"/>
    <rect x="60" y="590" width="270" height="46" rx="14" fill="#e65100"/>
    <rect x="60" y="620" width="270" height="16" fill="#e65100"/>
    <text x="195" y="619" text-anchor="middle" font-size="15" font-weight="bold" fill="white">MongoDB Atlas</text>
    <text x="195" y="658" text-anchor="middle" font-size="12" fill="#546e7a">Shared Database</text>
  </g>

  <!-- Firebase FCM -->
  <g filter="url(#sh)">
    <rect x="420" y="590" width="270" height="100" rx="14" fill="white" stroke="#b71c1c" stroke-width="2.5"/>
    <rect x="420" y="590" width="270" height="46" rx="14" fill="#b71c1c"/>
    <rect x="420" y="620" width="270" height="16" fill="#b71c1c"/>
    <text x="555" y="619" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Firebase FCM</text>
    <text x="555" y="658" text-anchor="middle" font-size="12" fill="#546e7a">Push Notifications</text>
  </g>

  <!-- LLM APIs -->
  <g filter="url(#sh)">
    <rect x="780" y="590" width="270" height="100" rx="14" fill="white" stroke="#00695c" stroke-width="2.5"/>
    <rect x="780" y="590" width="270" height="46" rx="14" fill="#00695c"/>
    <rect x="780" y="620" width="270" height="16" fill="#00695c"/>
    <text x="915" y="619" text-anchor="middle" font-size="15" font-weight="bold" fill="white">LLM APIs</text>
    <text x="915" y="658" text-anchor="middle" font-size="12" fill="#546e7a">OpenAI / Anthropic</text>
  </g>


  <!-- ============================================================ -->
  <!-- ARROWS -->
  <!-- ============================================================ -->

  <!-- Helper: label background -->
  <!-- (inline per arrow below) -->

  <!-- 1. Researcher -> React Client -->
  <line x1="200" y1="156" x2="200" y2="208"
        stroke="#546e7a" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="136" y="173" width="96" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="184" y="186" text-anchor="middle" font-size="11" fill="#37474f" font-weight="bold">Browser</text>

  <!-- 2. Participant -> Android APK -->
  <line x1="1000" y1="156" x2="1010" y2="208"
        stroke="#546e7a" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="948" y="173" width="80" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="988" y="186" text-anchor="middle" font-size="11" fill="#37474f" font-weight="bold">Uses App</text>

  <!-- 3a. Android -> React Client (WebView) -->
  <path d="M 880 248 Q 600 205 322 248"
        stroke="#1b5e20" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="508" y="208" width="186" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="601" y="221" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="bold">WebView (loads React)</text>

  <!-- 3b. React Client -> Android (FCM token) -->
  <path d="M 322 268 Q 600 236 880 268"
        stroke="#1b5e20" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#a2)"/>
  <rect x="510" y="256" width="180" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="600" y="269" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="bold">FCM Token (JS Bridge)</text>

  <!-- 4. React Client -> Node.js (REST) -->
  <path d="M 190 312 Q 190 360 190 390"
        stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="118" y="340" width="90" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="163" y="353" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">REST API</text>

  <!-- 5. Android -> Node.js (REST: FCM token registration) -->
  <path d="M 980 312 Q 980 356 520 440"
        stroke="#1565c0" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#a2)"/>
  <rect x="722" y="340" width="130" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="787" y="353" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">Token Register</text>

  <!-- 6. Node.js -> MongoDB -->
  <path d="M 200 500 Q 200 545 195 588"
        stroke="#e65100" stroke-width="2" fill="none" marker-end="url(#a4)"/>
  <rect x="116" y="532" width="110" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="171" y="545" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">Data Read/Write</text>

  <!-- 7. Python -> MongoDB -->
  <path d="M 510 500 Q 420 544 280 588"
        stroke="#e65100" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#a4)"/>
  <rect x="302" y="524" width="130" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="367" y="537" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">Data Read/Write</text>

  <!-- 8. Python -> Node.js (internal: pre-create conversation) -->
  <path d="M 422 445 L 380 445"
        stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#a6)"/>
  <rect x="356" y="428" width="110" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="411" y="441" text-anchor="middle" font-size="11" fill="#6a1b9a" font-weight="bold">Pre-create Conv</text>

  <!-- 9. Python -> Firebase FCM -->
  <path d="M 570 500 Q 570 544 555 588"
        stroke="#b71c1c" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <rect x="488" y="532" width="90" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="533" y="545" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="bold">FCM Push</text>

  <!-- 10. Firebase -> Android APK -->
  <path d="M 690 620 Q 870 560 970 312"
        stroke="#b71c1c" stroke-width="2.5" fill="none" stroke-dasharray="8,4" marker-end="url(#a3)"/>
  <rect x="840" y="468" width="118" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="899" y="481" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="bold">Push Notification</text>

  <!-- 11. Python -> LLM APIs -->
  <path d="M 718 445 Q 820 445 915 588"
        stroke="#00695c" stroke-width="2" fill="none" marker-end="url(#a5)"/>
  <rect x="762" y="490" width="96" height="20" rx="5" fill="#f8fafc" opacity="0.92"/>
  <text x="810" y="503" text-anchor="middle" font-size="11" fill="#00695c" font-weight="bold">LLM API Call</text>


  <!-- ============================================================ -->
  <!-- LEGEND -->
  <!-- ============================================================ -->

  <rect x="60" y="718" width="1080" height="80" rx="10" fill="white"
        stroke="#cfd8dc" stroke-width="1.5" filter="url(#sh)"/>
  <text x="600" y="740" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">Legend</text>

  <line x1="90" y1="762" x2="130" y2="762" stroke="#1565c0" stroke-width="2" marker-end="url(#a2)"/>
  <text x="138" y="766" font-size="11" fill="#1565c0">REST / HTTPS</text>

  <line x1="260" y1="762" x2="300" y2="762" stroke="#1b5e20" stroke-width="2"
        stroke-dasharray="5,3" marker-end="url(#a2)"/>
  <text x="308" y="766" font-size="11" fill="#1b5e20">WebView / JS Bridge</text>

  <line x1="480" y1="762" x2="520" y2="762" stroke="#b71c1c" stroke-width="2"
        stroke-dasharray="7,4" marker-end="url(#a3)"/>
  <text x="528" y="766" font-size="11" fill="#b71c1c">Push Notification (Firebase)</text>

  <line x1="730" y1="762" x2="770" y2="762" stroke="#e65100" stroke-width="2" marker-end="url(#a4)"/>
  <text x="778" y="766" font-size="11" fill="#e65100">Database R/W</text>

  <line x1="900" y1="762" x2="940" y2="762" stroke="#00695c" stroke-width="2" marker-end="url(#a5)"/>
  <text x="948" y="766" font-size="11" fill="#00695c">LLM API</text>

  <line x1="90" y1="784" x2="130" y2="784" stroke="#6a1b9a" stroke-width="2" marker-end="url(#a6)"/>
  <text x="138" y="788" font-size="11" fill="#6a1b9a">Internal Call</text>

  <rect x="260" y="776" width="12" height="12" rx="2" fill="none"
        stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="788" font-size="11" fill="#f57c00">Render boundary -- Node.js and Python run on the same server</text>

</svg>
